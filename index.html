<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypjam has moved to hypjam.com</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://hypjam.com/">
<meta http-equiv="refresh" content="0; url=https://hypjam.com/">
<script>
/* This GitHub Pages address is retired. The site lives at https://hypjam.com.
   Map the old path onto the new host so deep links (/hypjam/work, /hypjam/join)
   land on the matching page; hypjam.com's own redirects handle renamed pages. */
(function () {
  var p = location.pathname
    .replace(/^\/hypjam(?=\/|$)/, '')
    .replace(/\/index(\.html)?$/, '/')
    .replace(/\.html$/, '') || '/';
  location.replace('https://hypjam.com' + p + location.search + location.hash);
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #f4f4f4;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  a { color: #ff6f1f; }
</style>
</head>
<body>
  <p>hypjam has moved. <a href="https://hypjam.com/">Continue to hypjam.com</a></p>
</body>
</html>
