<!-- home · quotes — the reference site #testimonials
     One min-h-svh section: stacked full-bleed backgrounds that crossfade (700ms),
     a black/20 shade, and a centred frosted card (max-w 760, radius 12, white/16,
     blur 30, padding 36 20 20 40). The active quote's words are spans revealed
     line by line (420ms, 90ms per line; 260ms fade-out) by src/js/30-quotes.js,
     A single slide since 26 Sep 2026: the founder's statement over the aerial
     still (the owner asked for Avi's words on that picture and for the blurred
     studio slide, the reserved "On testimonials" slot and the thumbnail switcher
     to go). With one slide there is no autoplay.
     Copy: content/home.json → quotes. -->
<section id="quotes" class="quo section section--quote section--black" data-nav="image" data-theme="dark" data-quo data-quo-interval="5000">

  <div class="quo-bgs" aria-hidden="true">
    <img class="quo-bg is-active" data-quo-bg="0" src="/assets/img/stills/aerial-campus.jpg" alt="" width="1280" height="720" style="object-position:50% 50%" loading="lazy" decoding="async">
  </div>
  <div class="quo-shade" aria-hidden="true"></div>

  <div class="quo-wrap">
    <div class="quo-card quo-card--single" data-quo-card>
      <span class="quo-frame" aria-hidden="true"></span>

      <div class="quo-body">
        <!-- invisible sizer: the longest quote + 88px + two attribution lines locks the card height (the reference site) -->
        <div class="quo-sizer" aria-hidden="true">
          <p class="quo-text t-quote t-hanging">“{{content:home.quotes.items.0.text}}”</p>
          <div class="quo-sizer-gap"></div>
          <p class="quo-sig">{{content:home.quotes.items.0.name}}</p>
          <div class="quo-attr-lines"><p class="quo-role">{{content:home.quotes.items.0.role}}</p></div>
        </div>

        <!-- slide 0 · founder -->
        <figure class="quo-slide is-active" data-quo-slide="0">
          <blockquote class="quo-quote"><p class="quo-text t-quote t-hanging" data-quo-words>“{{content:home.quotes.items.0.text}}”</p></blockquote>
          <figcaption class="quo-attr">
            <p class="quo-sig" data-quo-fade="0">{{content:home.quotes.items.0.name}}</p>
            <div class="quo-attr-row">
              <div class="quo-attr-lines">
                <p class="quo-role" data-quo-fade="1">{{content:home.quotes.items.0.role}}</p>
              </div>
              <img class="quo-logo" data-quo-fade="1" src="/assets/brand/logos/hook-wordmark-on-dark.svg" alt="hypjam" width="88" height="32">
            </div>
          </figcaption>
        </figure>
      </div>

    </div>
  </div>

</section>
