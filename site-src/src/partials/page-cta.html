<!-- Closing CTA card (Lance: the sand-m card with copy left and footer-buildings right).
     Copy comes from PAGE META so any page can use this partial. Set these meta keys at
     the top of the page template (no nested comments here - HTML comments do not nest):
       cta-h2, cta-p, cta-label, cta-href
     e.g.  cta-h2 : a content token for services.index.cta_card.h2 ;  cta-href : /book
     (never write a placeholder token inside a comment - build.py expands it in place)
     The drawing is the drawing agent's /assets/img/hq-footer.svg; until it exists a small
     inline line drawing of the two buildings stands in (same slot, same size). -->
<section class="page-section page-section--closing">
  <div class="page-cta">
    <div class="page-cta__text">
      <h2 class="page-h2 page-cta__h2">{{page.cta-h2|Start with the brief. Add the rest when you are ready.}}</h2>
      <p class="page-cta__p">{{page.cta-p|Book a call and tell us what you are launching.}}</p>
      <div class="page-cta__btn"><a class="btn btn--light" href="{{page.cta-href|/book}}">{{page.cta-label|Book a call}}<span class="btn__ico"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M1.5 6h8M6.2 2.5 9.7 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a></div>
    </div>
    <div class="page-cta__panel">
      <img class="page-cta__art" src="/assets/img/hq-footer.svg" alt="{{content:footer.drawing.alt|Line drawing of hypjam's two HQ buildings}}" width="560" height="240" loading="lazy" decoding="async" onerror="this.classList.add('is-missing')">
      <svg class="page-cta__fallback" viewBox="0 0 560 240" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{content:footer.drawing.alt|Line drawing of hypjam's two HQ buildings}}">
        <!-- ground -->
        <path d="M20 214h520"/>
        <!-- building A: narrow, three floors, arched top windows -->
        <path d="M74 214V64h146v150"/><path d="M68 64h158"/><path d="M96 48h44v16M96 48v16"/>
        <path d="M74 112h146M74 160h146"/><path d="M80 118h134v4H80z" stroke-opacity=".5"/>
        <path d="M92 100V84a10 10 0 0 1 20 0v16zM122 100V84a10 10 0 0 1 20 0v16zM152 100V84a10 10 0 0 1 20 0v16zM182 100V84a10 10 0 0 1 20 0v16z"/>
        <path d="M92 150v-24h20v24zM122 150v-24h20v24zM152 150v-24h20v24zM182 150v-24h20v24z"/>
        <path d="M92 200v-26h20v26zM182 200v-26h20v26z"/><path d="M128 214v-34a19 19 0 0 1 38 0v34"/><path d="M118 214h58M122 206h50M126 198h42" stroke-opacity=".5"/>
        <!-- building B: wide, four floors, arcades at street level -->
        <path d="M262 214V56h240v158"/><path d="M256 56h252"/><path d="M356 40h52v16M356 40v16"/>
        <path d="M262 92h240M262 130h240M262 168h240"/>
        <path d="M280 82V66h14v16zM310 82V66h14v16zM340 82V66h14v16zM370 82V66h14v16zM400 82V66h14v16zM430 82V66h14v16zM460 82V66h14v16z"/>
        <path d="M280 120v-18h14v18zM310 120v-18h14v18zM340 120v-18h14v18zM370 120v-18h14v18zM400 120v-18h14v18zM430 120v-18h14v18zM460 120v-18h14v18z"/>
        <path d="M280 160v-22h14v22zM310 160v-22h14v22zM340 160v-22h14v22zM370 160v-22h14v22zM400 160v-22h14v22zM430 160v-22h14v22zM460 160v-22h14v22z"/>
        <path d="M280 214v-24a12 12 0 0 1 24 0v24M322 214v-24a12 12 0 0 1 24 0v24M418 214v-24a12 12 0 0 1 24 0v24M460 214v-24a12 12 0 0 1 24 0v24"/>
        <path d="M366 214v-34h32v34"/><path d="M360 176h44" stroke-opacity=".5"/>
        <path d="M508 110h16v10h-16zM508 148h16v10h-16zM508 186h16v10h-16z" stroke-opacity=".6"/>
      </svg>
    </div>
  </div>
</section>
